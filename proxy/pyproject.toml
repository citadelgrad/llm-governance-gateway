[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis[hiredis]>=5.2",
    "python-jose[cryptography]>=3.3",
    "python-multipart==0.0.31",
    "pyyaml>=6.0",
    "bcrypt>=4.2",
    "cachetools>=5.5",
    "tenacity>=9.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # Pinned via ai-gateway-6bh (Dependabot consolidation, PRs #8-#11):
    # previously transitive-only; pinned exact to match the
    # Dependabot-proposed resolved versions.
    "pyasn1==0.6.4",
    "starlette==1.3.1",
    "cryptography==48.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
    "ty>=0.0.40",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "bcrypt>=5.0.0",
    "hypothesis>=6.155.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # FastAPI Depends() in function defaults is idiomatic; long provider fixtures are tolerated

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ".." = project root (needed so mock.py's `from tests.fixtures import ...` resolves)
# "." = proxy/ (for proxy.app.* imports)
pythonpath = ["..", "."]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"
extra-paths = [".."]
