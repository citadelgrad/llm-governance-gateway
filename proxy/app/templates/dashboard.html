<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Usage Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    #controls { margin-bottom: 1.5rem; display: flex; gap: 0.75rem; align-items: center; }
  </style>
</head>
<body>
  <h1>Usage Dashboard</h1>

  <form id="controls">
    <label>
      Range:
      <select
        name="range"
        id="range-select"
        hx-get="/dashboard/data"
        hx-target="#dashboard-data"
        hx-trigger="change"
        hx-include="#controls"
      >
        <option value="today" selected>Today</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="all">All time</option>
        <option value="custom">Custom range</option>
      </select>
    </label>
    <label>
      Start: <input type="date" name="start" id="start-input" />
    </label>
    <label>
      End: <input type="date" name="end" id="end-input" />
    </label>
    <button
      type="button"
      hx-get="/dashboard/data"
      hx-target="#dashboard-data"
      hx-include="#controls"
    >
      Apply
    </button>
  </form>

  <div
    id="dashboard-data"
    hx-get="/dashboard/data?range=today"
    hx-trigger="load"
    hx-target="#dashboard-data"
  >
    Loading usage data…
  </div>
</body>
</html>
