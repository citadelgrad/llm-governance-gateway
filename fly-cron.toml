app = "ai-gateway-cron"
primary_region = "iad"

[build]
  dockerfile = "governance/Dockerfile"

# No [[services]] — this is a one-shot cron machine, not a long-running service.
# Schedule is set at machine-run time:
#
#   fly machine run \
#     --app ai-gateway-cron \
#     --schedule daily \
#     --cron "0 2 * * *" \
#     --entrypoint /app/scripts/fly-cron-entrypoint.sh \
#     --env DATABASE_URL="<secret-from-fly-secrets>" \
#     registry.fly.io/ai-gateway-cron:latest
#
# Or deploy once and use `fly machine update` to set the schedule.
# Fly v2 scheduled machines honour CRON_SCHEDULE and restart=never by default.

[env]
  LOG_LEVEL = "info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
