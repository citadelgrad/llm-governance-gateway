services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      - "${GATEWAY_POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.68.0-static
    command: ["run", "--server", "--watch", "/policies"]
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./governance
      args:
        SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy

  governance:
    build:
      context: ./governance
      args:
        SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      OPA_URL: http://opa:8181
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
      PSEUDONYM_HMAC_KEY: ${PSEUDONYM_HMAC_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  proxy:
    build: ./proxy
    ports:
      - "${GATEWAY_PROXY_PORT:-18765}:8000"
    volumes:
      - ./config:/workspace/proxy/config:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      GOVERNANCE_URL: http://governance:8000
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
    depends_on:
      redis:
        condition: service_healthy
      governance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tool-call-boundary OPA process, colocated per MCP Reverse Proxy replica
  # per docs/auth-architecture.md ("two evaluation points, two separate OPA
  # processes"). Distinct from the `opa` ingress instance above: it only
  # loads the mcp.authz package, never the llm/* policies.
  #
  # Loads policies/mcp from local disk (`-b`) rather than polling a remote
  # bundle service for now: the real bundle source is Governance's
  # entitlement-data endpoint (ai-gateway-h04.4), which doesn't exist yet.
  # Pointing at it before it exists would leave this healthcheck failing
  # forever and block `make up`/CI for the whole stack. ai-gateway-h04.5
  # swaps this for real bundle-service polling (polling.min_delay_seconds:
  # 5, max_delay_seconds: 10) once h04.4 lands.
  #
  # Published on a host port to satisfy this task's port-collision AC; the
  # doc's "reachable only over loopback/UDS from its paired replica"
  # isolation requirement is tightened in ai-gateway-h04.5, which owns OPA
  # Sidecar deployment.
  opa-sidecar:
    image: openpolicyagent/opa:0.68.0-debug
    command: ["run", "--server", "-a", "0.0.0.0:8181", "-b", "/policies/mcp"]
    ports:
      - "${GATEWAY_OPA_SIDECAR_PORT:-18767}:8181"
    volumes:
      - ./policies/mcp:/policies/mcp:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8181/health?bundles=true"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcpproxy:
    build: ./mcpproxy
    ports:
      - "${GATEWAY_MCPPROXY_PORT:-18766}:8000"
    depends_on:
      opa-sidecar:
        condition: service_healthy
      governance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
