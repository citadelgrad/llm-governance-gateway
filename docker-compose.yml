services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      - "${GATEWAY_POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.68.0-static
    command: ["run", "--server", "--watch", "/policies"]
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./governance
      args:
        SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy

  governance:
    build:
      context: ./governance
      args:
        SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      OPA_URL: http://opa:8181
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
      PII_BACKEND: ${PII_BACKEND:-presidio}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_DLP_LOCATION: ${GOOGLE_DLP_LOCATION:-global}
      GOOGLE_DLP_API_ENDPOINT: ${GOOGLE_DLP_API_ENDPOINT:-}
      GOOGLE_DLP_EXPECTED_SERVICE_ACCOUNT: ${GOOGLE_DLP_EXPECTED_SERVICE_ACCOUNT:-}
      GOOGLE_DLP_MIN_LIKELIHOOD: ${GOOGLE_DLP_MIN_LIKELIHOOD:-POSSIBLE}
      GOOGLE_DLP_TIMEOUT_SECONDS: ${GOOGLE_DLP_TIMEOUT_SECONDS:-5}
      GOOGLE_DLP_INFO_TYPES: ${GOOGLE_DLP_INFO_TYPES:-EMAIL_ADDRESS,PHONE_NUMBER,US_SOCIAL_SECURITY_NUMBER,CREDIT_CARD_NUMBER,IP_ADDRESS,STREET_ADDRESS,DATE_OF_BIRTH}
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
      PSEUDONYM_HMAC_KEY: ${PSEUDONYM_HMAC_KEY}
    volumes:
      - ./policies:/policies:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./governance/app
          target: /app/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./governance/pyproject.toml
        - action: rebuild
          path: ./governance/uv.lock
        - action: rebuild
          path: ./governance/Dockerfile

  proxy:
    build: ./proxy
    ports:
      - "${GATEWAY_PROXY_PORT:-18765}:8000"
    volumes:
      - ./config:/workspace/proxy/config:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      GOVERNANCE_URL: http://governance:8000
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
      MCPPROXY_URL: http://mcpproxy:8000
      JWT_SECRET: ${JWT_SECRET}
      MOCK_PROVIDERS: ${MOCK_PROVIDERS:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      governance:
        condition: service_healthy
      mcpproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    develop:
      watch:
        - action: sync+restart
          path: ./proxy/app
          target: /workspace/proxy/app
          ignore:
            - __pycache__/
        - action: restart
          path: ./config
        - action: rebuild
          path: ./proxy/pyproject.toml
        - action: rebuild
          path: ./proxy/uv.lock
        - action: rebuild
          path: ./proxy/Dockerfile

  mcpproxy:
    build: ./mcpproxy
    ports:
      - "${GATEWAY_MCPPROXY_PORT:-18766}:8000"
    environment:
      GOVERNANCE_URL: http://governance:8000
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
    depends_on:
      governance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    develop:
      watch:
        - action: sync+restart
          path: ./mcpproxy/app
          target: /workspace/mcpproxy/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./mcpproxy/pyproject.toml
        - action: rebuild
          path: ./mcpproxy/uv.lock
        - action: rebuild
          path: ./mcpproxy/Dockerfile

  # Tool-call-boundary OPA process, colocated per MCP Reverse Proxy replica
  # per docs/auth-architecture.md ("two evaluation points, two separate OPA
  # processes"). Distinct from the `opa` ingress instance above: it only
  # loads the mcp.authz package, never the llm/* policies.
  #
  # Polls Governance's entitlement-data endpoint (ai-gateway-h04.4) for its
  # bundle, per sidecar-config.yaml (min_delay_seconds: 5, max_delay_seconds:
  # 10). The image bakes in a derived variant of policies/mcp/authz.rego with
  # the `entitlements := {...}` literal stripped, so the polled bundle's base
  # data and the compiled rules don't collide at the same path (see
  # opa-sidecar/strip_entitlements.py) — the canonical policy file on disk is
  # untouched.
  #
  # `network_mode: "service:mcpproxy"` shares its paired replica's network
  # namespace instead of joining the compose bridge network, and OPA binds to
  # 127.0.0.1 only: together this makes the sidecar reachable exclusively
  # over loopback from that one mcpproxy container, never as an independently
  # addressable service to any other container (docs/auth-architecture.md,
  # "colocated sidecar, not in-process/WASM"; "reachable only over
  # loopback/UDS"). This requires the mcpproxy container to exist first, so
  # mcpproxy must not depend on this service's health in turn.
  opa-sidecar:
    build:
      context: .
      dockerfile: opa-sidecar/Dockerfile
    network_mode: "service:mcpproxy"
    environment:
      GOVERNANCE_INTERNAL_TOKEN: ${GOVERNANCE_INTERNAL_TOKEN}
    depends_on:
      mcpproxy:
        condition: service_started
      governance:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/health?bundles=true"]
      interval: 5s
      timeout: 5s
      retries: 10
    develop:
      watch:
        - action: rebuild
          path: ./policies/mcp/authz.rego
        - action: rebuild
          path: ./opa-sidecar

volumes:
  postgres_data:
