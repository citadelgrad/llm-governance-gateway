app = "ai-gateway-cron"
primary_region = "iad"

[build]
  dockerfile = "infra/example/fly.io/Dockerfile.cron"
  context = "."

# No [[services]] — this is a one-shot cron machine, not a long-running service.
# Schedule is set at machine-run time:
#
#   fly machine run \
#     --app ai-gateway-cron \
#     --schedule daily \
#     --cron "0 2 * * *" \
#     --entrypoint /app/infra/example/fly.io/fly-cron-entrypoint.sh \
#     registry.fly.io/ai-gateway-cron:latest
#
# DATABASE_URL must be set via `fly secrets set -a ai-gateway-cron`.
# Do NOT pass them with --env — that embeds plaintext secrets in the machine config.
# Or deploy once and use `fly machine update` to set the schedule.
# Fly v2 scheduled machines honour CRON_SCHEDULE and restart=never by default.

[env]
  LOG_LEVEL = "info"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
