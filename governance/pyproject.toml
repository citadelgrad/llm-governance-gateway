[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    "python-jose[cryptography]>=3.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "opa-python-client>=1.3",
    "transformers>=5.0.0rc3",
    "torch>=2.13.0",
    "google-cloud-dlp>=3.38.0",
    # Pinned via ai-gateway-6bh (Dependabot consolidation, PRs #3-#7):
    # previously transitive-only; pinned exact to match the
    # Dependabot-proposed resolved versions.
    "setuptools==83.0.0",
    "aiohttp==3.14.1",
    "cryptography==48.0.1",
    "starlette==1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.40",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # FastAPI dependency defaults and long SQL/policy strings are idiomatic here

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"
