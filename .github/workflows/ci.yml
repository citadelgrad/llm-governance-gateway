name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, policy, and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: local-ci-jwt-secret-for-compose-tests-only
      GOVERNANCE_INTERNAL_TOKEN: local-ci-governance-token
      PSEUDONYM_HMAC_KEY: local-ci-pseudonym-hmac-key-for-compose-tests-only
      MOCK_PROVIDERS: "true"
      SPACY_MODEL: en_core_web_sm
      SUPPRESS_GENERATED_KEYS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --redact --no-banner

      - name: Lint and type check
        run: make lint

      - name: Unit tests
        run: make test

      - name: Terraform validation and policy tests
        run: make terraform-check

      - name: OPA policy tests
        run: make opa-test

      - name: Integration tests
        run: make test-integration

      - name: Diff whitespace check
        run: git diff --check
