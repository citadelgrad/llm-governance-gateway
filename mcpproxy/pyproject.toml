[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "mcpproxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
    "ty>=0.0.40",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # FastAPI Depends() in function defaults is idiomatic; long provider fixtures are tolerated

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ".." = project root (needed so mcpproxy.app.* absolute imports resolve)
# "." = mcpproxy/ (for local test imports)
pythonpath = ["..", "."]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"
extra-paths = [".."]

[tool.uv]
# Pin exclude-newer explicitly (as an absolute, fixed timestamp - not a
# relative duration, which would re-resolve to a new absolute value, and
# therefore a new lockfile diff, on every `uv lock`) so it always takes
# precedence over a developer's personal global ~/.config/uv/uv.toml
# (e.g. `exclude-newer = "3 days"`). Without this, a bare `uv lock` or a
# `uv sync` invocation with mismatched flags can silently commit a
# machine-local [options] block into uv.lock (ai-gateway-u2sf / ai-gateway-xv6u),
# and could fail resolution outright if this project ever adds exact-pinned
# dependencies newer than a developer's personal cutoff (see proxy/pyproject.toml
# and governance/pyproject.toml, which hit this via ai-gateway-6bh's exact pins).
# This project does not enforce its own exclude-newer supply-chain policy,
# so the date is set far in the future to never restrict resolution.
exclude-newer = "2036-01-01T00:00:00Z"
