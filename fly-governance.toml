app = "ai-gateway-governance"
primary_region = "iad"

[build]
  dockerfile = "governance/Dockerfile"
  context = "governance"

[env]
  LOG_LEVEL = "info"
  SPACY_MODEL = "en_core_web_sm"
  DOCS_ENABLED = "false"
  OPA_URL = "http://ai-gateway-opa.internal:8181"

# No [[services]] block — internal network only via .internal DNS
# Reachable at http://ai-gateway-governance.internal:8000 from other Fly apps

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "performance-1x"
  memory = "1024mb"

# auto_stop_machines intentionally disabled: spaCy cold-start (~30s) exceeds the
# proxy httpx client timeout (10s), causing 503s if the machine is stopped.
# Configure keep-alive via `fly scale count 1 --app ai-gateway-governance`.
